<p-tabView>
    <p-tabPanel header="Финиш">
        <ng-container *ngIf="results.bestFinish">
            <p-table 
                #table
                [value]="results.bestFinish" 
                [scrollable]="true" scrollHeight="70vh" [virtualScroll]="true" [virtualScrollItemSize]="46"
                styleClass="p-datatable-sm" >
                <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
                    <tr [pSelectableRow]="item">
                        <td>{{ rowIndex+1 }}</td>
                        <td  style="text-align: right;">#{{ item.racerNum }}</td>
                        <td>{{ item.racerFullName }}</td>
                        <td>{{ item.dtString }}</td>
                    </tr>
                </ng-template> 
            </p-table>    
        </ng-container>
    </p-tabPanel>
    <p-tabPanel header="Лучший круг">
        <ng-container *ngIf="results.bestFinish">
            <p-table 
                #table
                [value]="results.bestLap" 
                [scrollable]="true" scrollHeight="70vh" [virtualScroll]="true" [virtualScrollItemSize]="46"
                styleClass="p-datatable-sm" >
                <ng-template pTemplate="body" let-item  let-rowIndex="rowIndex">
                    <tr [pSelectableRow]="item">
                        <td>{{ rowIndex+1 }}</td>
                        <td style="text-align: right;">#{{ item.racerNum }}</td>
                        <td>{{ item.racerFullName }}</td>
                        <td>{{ item.dtString }}</td>
                    </tr>
                </ng-template> 
            </p-table>    
        </ng-container>
    </p-tabPanel>
</p-tabView>
