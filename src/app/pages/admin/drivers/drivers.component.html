<p-table 
    #table
    [value]="items" 
    [paginator]="true"
    [rows]="20"     
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [rowsPerPageOptions]="[20, 50, 100, 500, 1000]"      
    [globalFilterFields]="['num','userFullName']"  selectionMode="single"  [(selection)]="selectedItem" (onRowSelect)="openIOLogSidebar()" (onRowUnselect)="ioVisible = false"
    styleClass="p-datatable-sm" >
    <ng-template pTemplate="caption">
        <span class="p-input-icon-left ml-auto">
            <i class="pi pi-search"></i>
            <input pInputText type="text"  (input)="table.filterGlobal($any($event.target).value, 'contains')" placeholder="Search keyword" />
        </span>
    </ng-template>        
    <ng-template pTemplate="body" let-item >
        <tr [pSelectableRow]="item">
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td width="100px">{{ driverConnectionStateNames[item.connectionState]}}</td>
            <td style="width: 10px; padding: 0;" [ngStyle]="{'background-color': item.connectionState === 3 ? 'MediumSeaGreen' : 'grey'}"></td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="5">No items found.</td>
        </tr>
    </ng-template>        
</p-table> 

<p-sidebar [visible]="ioVisible" position="right" [modal]="false" (onHide)="ioVisible=false" styleClass="p-sidebar-lg">
    <ng-template pTemplate="header">Driver IO</ng-template>
    <ng-template pTemplate="content">
        <p-table 
        #table
        [value]="ioLogItems" 
        [paginator]="true"
        [rows]="20"     
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[20, 40, 100, 500, 1000]"      
        styleClass="p-datatable-sm" >
        <ng-template pTemplate="body" let-item >
            <tr [pSelectableRow]="item">
                <td style="width: 30px;"  [ngStyle]="{'background-color': item.direction === 1 ? '#1e90ff36' : '#ff8c0030'}">
                    <i [class]="item.direction === 1 ? 'pi pi-angle-double-right' : 'pi  pi-angle-double-left'" ></i>
                </td>
                <td style="width: 80px;">{{ dateString(item.t) }}</td>
                <td>{{ item.data }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">No items found.</td>
            </tr>
        </ng-template>        
    </p-table>         
    </ng-template>
</p-sidebar>
