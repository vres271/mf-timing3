<div>
    <ng-container *ngIf="configItem$ | async as config"   >
        <div *ngIf="config.data.timecontrol">Timecontrol device: 
            <p-dropdown 
                [options]="[{value: 'serialPort', label: 'serialPort'},{value: 'timeControlMock', label: 'timeControlMock'}]" 
                [(ngModel)]="config.data.timecontrol.device" 
                (onChange)="saveConfig(config)"
                >
            </p-dropdown>
        </div>
    </ng-container>
</div>
