
<p-sidebar [(visible)]="sidebarVisible" position="right" [modal]="false" (onHide)="selectedItems = []">
    <ng-template pTemplate="header">User</ng-template>
    <ng-template pTemplate="content">Body Content</ng-template>
    <ng-template pTemplate="footer">Selected rows: {{selectedItems.length}}</ng-template>
</p-sidebar>


<ng-container *ngIf="users$ | async as data">
    <p-table 
        #table
        [value]="data" 
        [paginator]="true"
        [rows]="20"
        [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '50rem' }"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [rowsPerPageOptions]="[20, 50, 100, 500, 1000]"      
        [globalFilterFields]="['name', 'firstName', 'secondName', 'thirdName']" 
        selectionMode="multiple" [(selection)]="selectedItems" [metaKeySelection]="true" (onRowSelect)="sidebarVisible = true"
        styleClass="p-datatable-sm" >
        <ng-template pTemplate="caption">
            <div class="flex">
                <span class="p-input-icon-left ml-auto">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text"  (input)="table.filterGlobal($any($event.target).value, 'contains')" placeholder="Search keyword" />
                </span>
            </div>
        </ng-template>        
        <ng-template pTemplate="header">
            <tr>
                <th width="30px">id</th>
                <th pSortableColumn="name" >name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="firstName" >firstName <p-sortIcon field="firstName"></p-sortIcon></th>
                <th pSortableColumn="secondName" >secondName <p-sortIcon field="secondName"></p-sortIcon></th>
                <th pSortableColumn="thirdName" >thirdName <p-sortIcon field="thirdName"></p-sortIcon></th>
                <th pSortableColumn="email" >email <p-sortIcon field="email"></p-sortIcon></th>
                <th pSortableColumn="active" >active <p-sortIcon field="active"></p-sortIcon></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item">
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.firstName }}</td>
                <td>{{ item.secondName }}</td>
                <td>{{ item.thirdName }}</td>
                <td>{{ item.email }}</td>
                <td>{{ item.active }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">No customers found.</td>
            </tr>
        </ng-template>        
    </p-table>    
</ng-container>
